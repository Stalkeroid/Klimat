<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клімат кімнати</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/theme.css?v=29">
<link rel="stylesheet" href="css/style.css?v=29">
</head>
<body>
<div id="app"></div>

<div id="setup" hidden>
  <form id="setupForm" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <span class="eyebrow">THINGSPEAK · КАНАЛ <span id="setupChannel"></span></span>
    <h2 id="setupTitle">Підключення до каналу</h2>
    <p>Вставте <b>Read API Key</b> (ThingSpeak → канал → вкладка API Keys). Ключ зберігається лише в цьому браузері — на кожному пристрої його треба ввести один раз.</p>
    <label for="keyInput">READ API KEY</label>
    <input id="keyInput" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXXXXXXXXXXXXX">
    <span class="err" id="setupErr" role="alert"></span>
    <button type="button" class="demo-link" id="setupDemo">Немає ключа? Відкрити демо з випадковими даними</button>
    <div class="actions">
      <button type="button" class="secondary" id="setupCancel" hidden>Скасувати</button>
      <button type="submit" class="primary">Зберегти</button>
    </div>
  </form>
</div>

<template id="tpl">
<div style="min-height: 900px; box-sizing: border-box; padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 20px; background: transparent; color: var(--text); font-family: var(--font-text)">
  <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -0.01em; color: var(--text)">Клімат кімнати</h1>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <!-- «машина часу»: перемикач дня -->
      <div class="daynav" role="group" aria-label="Вибір дня">
        <button class="dn-btn" type="button" onClick="{{prevDay}}" aria-label="Попередній день" aria-disabled="{{prevOff}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <span class="dn-mid">
          <button class="dn-day" type="button" onClick="{{openPicker}}" aria-label="Вибрати день: {{dayBtn}}">{{dayBtn}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></button>
          <input class="day-pick" type="date" tabindex="-1" aria-hidden="true" value="{{dayPickValue}}" min="{{dayPickMin}}" max="{{dayPickMax}}" onChange="{{pickDay}}">
        </span>
        <button class="dn-btn" type="button" onClick="{{nextDay}}" aria-label="Наступний день" aria-disabled="{{nextOff}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      </div>
      <span class="glass" role="status" title="{{badgeTitle}}" style="display: flex; align-items: center; gap: 8px; font-family: var(--font-data); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-2); border: 1px solid var(--stroke-strong); border-radius: var(--r-pill); padding: 7px 12px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{badgeColor}}; box-shadow: 0 0 8px {{badgeColor}}"></span>{{badge}}</span>
      
    </div>
  </header>

  <main style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
    <div class="stage" onClick="{{stageClick}}" onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}" onPointerCancel="{{onUp}}" onWheel="{{onWheel}}" style="flex: 999 1 640px; min-width: 0; height: 720px; position: relative; overflow: hidden; border-radius: var(--r-lg); background: transparent; border: 1px solid var(--stroke); perspective: 1100px; touch-action: none; user-select: none; cursor: {{cursor}}">
      <div class="glass stage-glass" aria-hidden="true" style="position: absolute; inset: 0; border: 0; pointer-events: none"></div>
      <div class="scene" style="scale: {{sceneScale}}; position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; transform: {{camT}}; transition: {{camTr}}">
        <sc-for list="{{faces}}" as="f">
          <div style="position: absolute; left: 0; top: 0; transform-origin: 0 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.045); width: {{f.w}}px; height: {{f.h}}px; transform: {{f.t}}; background: {{f.bg}}; background-image: {{f.img}}; background-size: {{f.bs}}; background-position: {{f.bp}}; opacity: {{f.op}}; transition: opacity .25s"></div>
        </sc-for>
      </div>
      <div class="scene" style="scale: {{sceneScale}}; z-index: 2; position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; transform: {{camT}}; transition: {{camTr}}">
        <!-- невидимі «якорі» датчиків у 3D: за ними стежить шар міток (js/markers.js) -->
        <sc-for list="{{markers}}" as="m">
          <div class="anchor" style="position: absolute; left: -1px; top: -1px; width: 2px; height: 2px; pointer-events: none; transform: {{m.t}}"></div>
        </sc-for>
      </div>
      <!-- мітки датчиків: плаский шар поверх кімнати, завжди одного розміру й чіткі -->
      <div class="mk-layer" aria-label="Датчики в кімнаті">
        <sc-for list="{{markers}}" as="m">
          <div class="mk {{m.cls}}" style="--c: {{m.color}}; opacity: {{m.op}}">
            <span class="mk-lead"></span>
            <button class="mk-tag" type="button" onClick="{{m.pick}}" aria-label="{{m.aria}}" style="pointer-events: {{m.pe}}"><span class="mk-name">{{m.name}}</span><span class="mk-val">{{m.temp}}</span></button>
            <button class="mk-pt" type="button" tabindex="-1" onClick="{{m.pick}}" aria-label="{{m.aria}}" style="pointer-events: {{m.pe}}"><i></i></button>
          </div>
        </sc-for>
      </div>
        <sc-if value="{{ringOn}}">
        <div style="z-index: 3; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
        <div class="ring" onClick="{{ringClick}}" onPointerMove="{{ringMove}}" onPointerLeave="{{clearHover}}" style="flex: none; position: relative; width: 332px; height: 332px; pointer-events: auto; zoom: {{ringScale}}">
          <svg width="332" height="332" viewBox="-166 -166 332 332" role="img" aria-label="{{ringAria}}" style="display: block; overflow: visible">
            <circle r="164" stroke-width="1" style="fill: var(--ring-disc); stroke: var(--ring-grid)"></circle>
            <sc-for list="{{grid}}" as="g">
              <circle r="{{g.r}}" fill="none" stroke-dasharray="2 4" style="stroke: var(--ring-grid)"></circle>
            </sc-for>
            <line x1="0.0" y1="-68.0" x2="0.0" y2="-160.0" stroke-width="1" stroke-dasharray="3 3" style="pointer-events: none; stroke: var(--ring-axis)"></line>
            <line x1="68.0" y1="0.0" x2="160.0" y2="0.0" stroke-width="1" stroke-dasharray="3 3" style="pointer-events: none; stroke: var(--ring-axis)"></line>
            <line x1="0.0" y1="68.0" x2="0.0" y2="160.0" stroke-width="1" stroke-dasharray="3 3" style="pointer-events: none; stroke: var(--ring-axis)"></line>
            <line x1="-68.0" y1="0.0" x2="-160.0" y2="0.0" stroke-width="1" stroke-dasharray="3 3" style="pointer-events: none; stroke: var(--ring-axis)"></line>
            <sc-for list="{{bars}}" as="b">
              <path class="bar" d="{{b.d}}" opacity="{{b.op}}" stroke-width="1.5" onPointerEnter="{{b.hover}}" style="cursor: pointer; fill: {{b.fill}}; stroke: {{b.stroke}}"></path>
            </sc-for>
            <circle cx="{{nowDot.x}}" cy="{{nowDot.y}}" r="3.5" fill="var(--text)" opacity="{{nowDot.op}}"></circle>
            <circle r="66" style="pointer-events: none; fill: var(--ring-core); stroke: var(--stroke)"></circle>
          </svg>
          <!-- центр кільця: головне значення завжди рівно по центру; підписи над і під ним його не зсувають -->
          <div style="position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; text-align: center">
            <span style="position: absolute; left: -62px; width: 124px; bottom: 22px; font-family: var(--font-text); font-size: 10px; letter-spacing: 0.08em; color: var(--text-3); white-space: nowrap">{{center.code}} · <b style="font-weight: 700; color: var(--text)">{{center.mk}}</b></span>
            <span style="position: absolute; left: -90px; width: 180px; top: -19px; height: 38px; line-height: 38px; font-family: var(--font-num); font-size: 34px; font-weight: 600; color: {{center.color}}">{{center.temp}}</span>
            <span style="position: absolute; left: -62px; width: 124px; top: 22px; display: flex; flex-direction: column; align-items: center; gap: 2px">
              <span style="font-family: var(--font-data); font-size: 10px; color: var(--text-2); white-space: nowrap">{{center.sub}}</span>
              <span style="font-family: var(--font-text); font-size: 10px; color: var(--text-3); white-space: nowrap">{{center.sub2}}</span>
            </span>
          </div>
          <span style="font-family: var(--font-data); font-size: 11px; font-weight: 600; color: var(--text); pointer-events: none; position: absolute; white-space: nowrap; left: 171px; top: 11px">{{rl.a}}</span>
          <span style="font-family: var(--font-data); font-size: 11px; font-weight: 600; color: var(--text); pointer-events: none; position: absolute; white-space: nowrap; left: 306px; top: 143px; transform: translateX(-50%)">{{rl.b}}</span>
          <span style="font-family: var(--font-data); font-size: 11px; font-weight: 600; color: var(--text); pointer-events: none; position: absolute; white-space: nowrap; left: 171px; top: 308px">{{rl.c}}</span>
          <span style="font-family: var(--font-data); font-size: 11px; font-weight: 600; color: var(--text); pointer-events: none; position: absolute; white-space: nowrap; left: 26px; top: 143px; transform: translateX(-50%)">{{rl.d}}</span>
          <!-- кутові кнопки кільця: ліворуч — температура/вологість, праворуч — доба/година -->
          <button class="pin-btn" onClick="{{toggleMetric}}" aria-label="{{metricBtn.label}}" title="{{metricBtn.label}}" aria-pressed="{{metricBtn.pressed}}" style="position: absolute; bottom: {{btn.bottom}}px; width: {{btn.size}}px; height: {{btn.size}}px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: {{btn.radius}}px; border: 1px solid var(--stroke-strong); background: var(--button); color: var(--text-2); cursor: pointer; left: {{btn.inset}}px">
            <sc-if value="{{metricBtn.showDrop}}">
            <svg width="{{btn.icon}}" height="{{btn.icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.5 4.4 6 7.7 6 11a6 6 0 0 1-12 0c0-3.3 2.5-6.6 6-11z"></path></svg>
            </sc-if>
            <sc-if value="{{metricBtn.showTherm}}">
            <svg width="{{btn.icon}}" height="{{btn.icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"></path></svg>
            </sc-if>
          </button>
          <sc-if value="{{dayMode}}">
          <button class="pin-btn" onClick="{{openHour}}" aria-label="Детальний графік за цю годину" title="Детальний графік за цю годину" style="position: absolute; bottom: {{btn.bottom}}px; width: {{btn.size}}px; height: {{btn.size}}px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: {{btn.radius}}px; border: 1px solid var(--stroke-strong); background: var(--button); color: var(--text-2); cursor: pointer; right: {{btn.inset}}px">
            <svg width="{{btn.icon}}" height="{{btn.icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15l4-5 3 3 5-6"></path></svg>
          </button>
          </sc-if>
          <sc-if value="{{hourMode}}">
          <button class="pin-btn" onClick="{{closeHour}}" aria-label="Назад до графіка за добу" title="Назад до графіка за добу" style="position: absolute; bottom: {{btn.bottom}}px; width: {{btn.size}}px; height: {{btn.size}}px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: {{btn.radius}}px; border: 1px solid var(--stroke-strong); background: var(--button); color: var(--text-2); cursor: pointer; right: {{btn.inset}}px">
            <svg width="{{btn.icon}}" height="{{btn.icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          </button>
          </sc-if>
        </div>
        </div>
      </sc-if>

      <div class="hint" style="position: absolute; left: 20px; bottom: 18px; z-index: 5; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); pointer-events: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
        {{hint}}
      </div>
      <div class="legend" style="position: absolute; right: 20px; bottom: 16px; z-index: 5; display: flex; align-items: center; gap: 18px; font-family: var(--font-data); font-size: 11px; color: var(--text-3); pointer-events: none">
        <span class="legend-item" style="display: flex; align-items: center; gap: 6px"><span style="color: {{lg.h}}; transition: color .2s">0%</span><span class="legend-bar" style="display: block; width: 120px; height: 8px; border-radius: var(--r-xs); background: linear-gradient(90deg, rgb(233,180,90), rgb(233,213,138) 30%, rgb(124,196,228) 45%, rgb(88,140,230) 70%, rgb(70,90,210))"></span><span style="color: {{lg.h}}; transition: color .2s">100%</span></span>
        <span class="legend-item" style="display: flex; align-items: center; gap: 6px"><span style="color: {{lg.t}}; transition: color .2s">0°</span><span class="legend-bar" style="display: block; width: 120px; height: 8px; border-radius: var(--r-xs); background: linear-gradient(90deg, #2F6FE0, #58B4D9 25%, #E9D58A 36.7%, #F59E4B 53.3%, #E8553F)"></span><span style="color: {{lg.t}}; transition: color .2s">60°</span></span>
      </div>
    </div>

    <aside style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{list}}" as="s">
          <button class="list-btn" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 14px; text-align: left; cursor: pointer; border-radius: var(--r-md); color: var(--text); font-family: var(--font-text); background: {{s.bg}}; border: 1px solid {{s.border}}; box-shadow: inset 0 1px 0 var(--highlight)">
            <span style="flex: none; width: 12px; height: 12px; border-radius: 50%; background: {{s.color}}; box-shadow: 0 0 12px {{s.color}}"></span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 600">{{s.name}}</span>
            </span>
            <svg width="72" height="26" viewBox="0 0 72 26" aria-hidden="true" style="flex: none"><polyline points="{{s.spark}}" fill="none" stroke="{{s.color}}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>
            <span style="flex: none; width: 62px; text-align: right; display: flex; flex-direction: column; gap: 1px">
              <span style="font-family: var(--font-num); font-size: 19px; font-weight: 600">{{s.temp}}</span>
              <span style="font-family: var(--font-data); font-size: 11px; color: var(--cold)">{{s.hum}}</span>
            </span>
          </button>
        </sc-for>
      </div>

      <sc-if value="{{hasSel}}">
        <section class="glass" style="display: flex; flex-direction: column; gap: 14px; border-radius: var(--r-lg); padding: 18px">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
            <h2 style="margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text)">{{det.name}}</h2>
            <span style="font-size: 12px; color: var(--text-3)">{{det.period}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <div class="tile" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px"><span style="font-size: 12px; color: var(--text-3)">{{det.nowLabel}}</span><span style="font-family: var(--font-num); font-size: 25px; font-weight: 600; color: {{det.color}}">{{det.now}}</span></div>
            <div class="tile" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px"><span style="font-size: 12px; color: var(--text-3)">Середня</span><span style="font-family: var(--font-num); font-size: 25px; font-weight: 600">{{det.avg}}</span></div>
            <div class="tile" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px"><span style="font-size: 12px; color: var(--text-3)">Мінімум · {{det.minAt}}</span><span style="font-family: var(--font-num); font-size: 20px; font-weight: 600; color: var(--cold)">{{det.min}}</span></div>
            <div class="tile" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px"><span style="font-size: 12px; color: var(--text-3)">Максимум · {{det.maxAt}}</span><span style="font-family: var(--font-num); font-size: 20px; font-weight: 600; color: var(--warm)">{{det.max}}</span></div>
            <div class="tile" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; grid-column: 1 / -1"><span style="font-size: 12px; color: var(--text-3)">{{det.humLabel}}</span><span style="font-family: var(--font-num); font-size: 20px; font-weight: 600; color: var(--cold)">{{det.hum}}</span></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <svg viewBox="0 0 320 112" width="100%" role="img" aria-label="{{det.chartAria}}" style="display: block">
              <sc-for list="{{det.gridY}}" as="gy">
                <line x1="0" x2="320" y1="{{gy.y}}" y2="{{gy.y}}" style="stroke: var(--stroke)"></line>
              </sc-for>
              <path d="{{det.area}}" fill="{{det.color}}" opacity="0.14"></path>
              <polyline points="{{det.line}}" fill="none" stroke="{{det.color}}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
              <circle cx="{{det.dot.x}}" cy="{{det.dot.y}}" r="4" fill="{{det.color}}" stroke-width="2" style="stroke: var(--bg)"></circle>
            </svg>
            <div style="display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 10px; color: var(--text-4)">
              <span>{{det.xStart}}</span><span>{{det.xMid}}</span><span>{{det.xEnd}}</span>
            </div>
            <div style="font-family: var(--font-data); font-size: 10px; color: var(--text-4)">шкала: {{det.yRange}}</div>
          </div>
          <p style="margin: 0; font-size: 13px; color: var(--text-2)">Зміна за добу: <span style="font-family: var(--font-num); font-weight: 600">{{det.delta}}</span></p>
        </section>
      </sc-if>
      <sc-if value="{{noSel}}">
        <section class="glass" style="display: flex; flex-direction: column; gap: 12px; border-radius: var(--r-lg); padding: 18px">
          <h2 style="margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text)">Уся кімната</h2>
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-2)">Оберіть датчик у кімнаті або в списку — камера наблизиться до нього, і довкола з’явиться кільце з графіком за 24 години. Кожен сегмент кільця — одна година доби, 00:00 угорі.</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <div class="tile" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px"><span style="font-size: 12px; color: var(--text-3)">Найтепліше</span><span style="font-size: 14px; font-weight: 600">{{room.warm}}</span></div>
            <div class="tile" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px"><span style="font-size: 12px; color: var(--text-3)">Найпрохолодніше</span><span style="font-size: 14px; font-weight: 600">{{room.cool}}</span></div>
            <div class="tile" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px"><span style="font-size: 12px; color: var(--text-3)">{{room.spreadLabel}}</span><span style="font-family: var(--font-num); font-size: 17px; font-weight: 600">{{room.spread}}</span></div>
            <div class="tile" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px"><span style="font-size: 12px; color: var(--text-3)">Діапазон за добу</span><span style="font-family: var(--font-num); font-size: 17px; font-weight: 600">{{room.range}}</span></div>
          </div>
        </section>
      </sc-if>
      <button class="keyBtn" type="button" onClick="{{changeKey}}">Змінити ключ ThingSpeak</button>
    </aside>
  </main>
</div>
</template>

<script src="js/config.js?v=29"></script>
<script src="js/engine.js?v=29"></script>
<script src="js/room.js?v=29"></script>
<script src="js/utils.js?v=29"></script>
<script src="js/data.js?v=29"></script>
<script src="js/markers.js?v=29"></script>
<script src="js/app.js?v=29"></script>
</body>
</html>
