<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клімат кімнати</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
body{margin:0;background:#0B1019}
a{color:#7CC4E4}a:hover{color:#A9DCF0}
.scene > *{transform-style:preserve-3d}
@keyframes ringIn{from{opacity:0}to{opacity:1}}
.ring{animation:ringIn .6s ease .85s both}
.sensor-btn:focus-visible,.list-btn:focus-visible,.back-btn:focus-visible{outline:2px solid #7CC4E4;outline-offset:3px}
.list-btn:hover{background:rgba(255,255,255,0.05)}
.bar{transition:opacity .2s}
#setup{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,0.82);font-family:Inter,system-ui,sans-serif;color:#E6EAF2;padding:20px;box-sizing:border-box}
#setup[hidden]{display:none}
#setup form{max-width:420px;width:100%;background:#121A27;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
#setup h2{margin:0;font-family:Manrope,Inter,sans-serif;font-size:20px}
#setup p{margin:0;font-size:14px;line-height:1.5;color:#C9D1DE}
#setup label{font-size:13px;color:#9AA4B5}
#setup input{font:inherit;font-family:'JetBrains Mono',monospace;font-size:15px;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);background:#0F1622;color:#F2F4F8}
#setup button{font:inherit;font-weight:600;min-height:44px;border-radius:10px;border:0;background:#7CC4E4;color:#0B1019;cursor:pointer}
#setup .err{color:#F59E8B;font-size:13px}
@media (max-width:700px){.stage{height:500px !important}.hint{display:none !important}}
.keyBtn{font:inherit;font-size:12px;background:none;border:0;color:#7CC4E4;cursor:pointer;padding:4px 0;min-height:24px}
</style>
</head>
<body>
<div id="app"></div>

<div id="setup" hidden>
  <form id="setupForm">
    <h2>Підключення до ThingSpeak</h2>
    <p>Вставте <b>Read API Key</b> вашого каналу (ThingSpeak → канал → вкладка API Keys). Ключ зберігається лише в цьому браузері — на кожному пристрої його треба ввести один раз.</p>
    <label for="keyInput">Read API Key</label>
    <input id="keyInput" autocomplete="off" spellcheck="false" placeholder="XXXXXXXXXXXXXXXX">
    <span class="err" id="setupErr"></span>
    <button type="submit">Зберегти</button>
  </form>
</div>

<template id="tpl">
<div style="min-height: 900px; box-sizing: border-box; padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 20px; background: #0B1019; color: #E6EAF2; font-family: Inter, system-ui, sans-serif">
  <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; color: #F2F4F8">Клімат кімнати</h1>
      <p style="margin: 0; font-size: 14px; color: #9AA4B5">4 датчики температури · останні 24 години · дані від {{updated}}</p>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #C9D1DE; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 6px 12px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{badgeColor}}; box-shadow: 0 0 8px {{badgeColor}}"></span>{{badge}}</span>
      
    </div>
  </header>

  <main style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
    <div class="stage" onClick="{{stageClick}}" onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}" onPointerCancel="{{onUp}}" onWheel="{{onWheel}}" style="flex: 999 1 640px; min-width: 0; height: 720px; position: relative; overflow: hidden; border-radius: 20px; background: #0F1622; border: 1px solid rgba(255,255,255,0.06); perspective: 1100px; touch-action: none; user-select: none; cursor: {{cursor}}">
      <div class="scene" style="scale: {{sceneScale}}; position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; transform: {{camT}}; transition: {{camTr}}">
        <sc-for list="{{faces}}" as="f">
          <div style="position: absolute; left: 0; top: 0; transform-origin: 0 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.045); width: {{f.w}}px; height: {{f.h}}px; transform: {{f.t}}; background: {{f.bg}}; background-image: {{f.img}}; background-size: {{f.bs}}; background-position: {{f.bp}}; opacity: {{f.op}}; transition: opacity .25s"></div>
        </sc-for>
      </div>
      <div class="scene" style="scale: {{sceneScale}}; z-index: 2; position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; transform: {{camT}}; transition: {{camTr}}">
        <sc-for list="{{markers}}" as="m">
          <div style="position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; transform-origin: 14px 14px; transform: {{m.t}}; transition: {{m.tr}}; opacity: {{m.op}}; pointer-events: {{m.pe}}">
            <button class="sensor-btn" onClick="{{m.pick}}" aria-label="{{m.aria}}" style="width: 28px; height: 28px; border-radius: 50%; padding: 0; cursor: pointer; border: 3px solid #0B1019; background: {{m.color}}; box-shadow: 0 0 0 5px {{m.halo}}, 0 0 26px {{m.color}}"></button>
            <span style="position: absolute; left: 36px; top: 2px; white-space: nowrap; pointer-events: none; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #F2F4F8; background: rgba(11,16,26,0.86); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 3px 8px">{{m.name}} · {{m.temp}}</span>
          </div>
        </sc-for>
        <sc-if value="{{ringOn}}">
          <div class="ring" onClick="{{ringClick}}" onPointerMove="{{ringMove}}" onMouseMove="{{ringMove}}" onPointerLeave="{{clearHover}}" style="position: absolute; left: -166px; top: -166px; width: 332px; height: 332px; transform-origin: 166px 166px; transform: {{ringT}}; transition: {{camTr}}">
            <svg width="332" height="332" viewBox="-166 -166 332 332" role="img" aria-label="{{ringAria}}" onMouseLeave="{{clearHover}}" style="display: block; overflow: visible">
              <circle r="164" fill="rgba(11,16,26,0.78)" stroke="rgba(255,255,255,0.10)" stroke-width="1"></circle>
              <sc-for list="{{grid}}" as="g">
                <circle r="{{g.r}}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-dasharray="2 4"></circle>
              </sc-for>
              <line x1="0.0" y1="-68.0" x2="0.0" y2="-160.0" stroke="#7D8796" stroke-width="1" stroke-dasharray="3 3" style="pointer-events: none"></line>
              <line x1="68.0" y1="0.0" x2="160.0" y2="0.0" stroke="#7D8796" stroke-width="1" stroke-dasharray="3 3" style="pointer-events: none"></line>
              <line x1="0.0" y1="68.0" x2="0.0" y2="160.0" stroke="#7D8796" stroke-width="1" stroke-dasharray="3 3" style="pointer-events: none"></line>
              <line x1="-68.0" y1="0.0" x2="-160.0" y2="0.0" stroke="#7D8796" stroke-width="1" stroke-dasharray="3 3" style="pointer-events: none"></line>
              <sc-for list="{{bars}}" as="b">
                <path class="bar" d="{{b.d}}" fill="{{b.fill}}" opacity="{{b.op}}" stroke="{{b.stroke}}" stroke-width="1.5" onMouseEnter="{{b.hover}}" onPointerEnter="{{b.hover}}" onClick="{{b.hover}}" style="cursor: pointer"></path>
              </sc-for>
              <circle cx="{{nowDot.x}}" cy="{{nowDot.y}}" r="3.5" fill="#F2F4F8" opacity="{{nowDot.op}}"></circle>
              <circle r="66" fill="#0B1019" stroke="rgba(255,255,255,0.08)" style="pointer-events: none"></circle>
            </svg>
            <div style="position: absolute; left: 50%; top: 50%; width: 124px; margin-left: -62px; margin-top: -40px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; pointer-events: none; text-align: center">
              <span style="font-family: Inter, sans-serif; font-size: 10px; letter-spacing: 0.08em; color: #9AA4B5; white-space: nowrap">{{center.code}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 600; line-height: 1.1; color: {{center.color}}">{{center.temp}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #C9D1DE; white-space: nowrap">{{center.sub}}</span>
            </div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #E6EAF2; pointer-events: none; position: absolute; white-space: nowrap; left: 171px; top: 11px">{{rl.a}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #E6EAF2; pointer-events: none; position: absolute; white-space: nowrap; left: 306px; top: 143px; transform: translateX(-50%)">{{rl.b}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #E6EAF2; pointer-events: none; position: absolute; white-space: nowrap; left: 171px; top: 308px">{{rl.c}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #E6EAF2; pointer-events: none; position: absolute; white-space: nowrap; left: 26px; top: 143px; transform: translateX(-50%)">{{rl.d}}</span>
            <sc-if value="{{dayMode}}">
            <button class="pin-btn" onClick="{{openHour}}" aria-label="Детальний графік за цю годину" title="Детальний графік за цю годину" style="position: absolute; left: 50%; top: 50%; margin-left: -11px; margin-top: 38px; width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid rgba(255,255,255,0.16); background: #182233; color: #C9D1DE; cursor: pointer">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15l4-5 3 3 5-6"></path></svg>
            </button>
            </sc-if>
            <sc-if value="{{hourMode}}">
            <button class="pin-btn" onClick="{{closeHour}}" aria-label="Назад до графіка за добу" title="Назад до графіка за добу" style="position: absolute; left: 50%; top: 50%; margin-left: -11px; margin-top: 38px; width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid rgba(255,255,255,0.16); background: #182233; color: #C9D1DE; cursor: pointer">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            </button>
            </sc-if>
          </div>
        </sc-if>
      </div>

      <div class="hint" style="position: absolute; left: 20px; bottom: 18px; z-index: 5; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9AA4B5; pointer-events: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
        {{hint}}
      </div>
      <div style="position: absolute; right: 20px; bottom: 16px; z-index: 5; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA4B5; pointer-events: none">
        <span>0°</span>
        <span style="display: block; width: 140px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #2F6FE0, #58B4D9 30%, #E9D58A 44%, #F59E4B 64%, #E8553F)"></span>
        <span>+60°</span>
      </div>
    </div>

    <aside style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{list}}" as="s">
          <button class="list-btn" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 14px; text-align: left; cursor: pointer; border-radius: 14px; color: #E6EAF2; font-family: Inter, sans-serif; background: {{s.bg}}; border: 1px solid {{s.border}}">
            <span style="flex: none; width: 12px; height: 12px; border-radius: 50%; background: {{s.color}}; box-shadow: 0 0 12px {{s.color}}"></span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 600">{{s.name}}</span>
              <span style="font-size: 12px; color: #9AA4B5">{{s.where}}</span>
            </span>
            <svg width="72" height="26" viewBox="0 0 72 26" aria-hidden="true" style="flex: none"><polyline points="{{s.spark}}" fill="none" stroke="{{s.color}}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>
            <span style="flex: none; width: 62px; text-align: right; display: flex; flex-direction: column; gap: 1px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600">{{s.temp}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8EC9F5">{{s.hum}}</span>
            </span>
          </button>
        </sc-for>
      </div>

      <sc-if value="{{hasSel}}">
        <section style="display: flex; flex-direction: column; gap: 14px; background: #121A27; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
            <h2 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 18px; font-weight: 700; color: #F2F4F8">{{det.name}}</h2>
            <span style="font-size: 12px; color: #9AA4B5">24 год</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <div style="display: flex; flex-direction: column; gap: 2px; background: #0F1622; border-radius: 10px; padding: 10px 12px"><span style="font-size: 12px; color: #9AA4B5">Зараз</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; color: {{det.color}}">{{det.now}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px; background: #0F1622; border-radius: 10px; padding: 10px 12px"><span style="font-size: 12px; color: #9AA4B5">Середня</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600">{{det.avg}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px; background: #0F1622; border-radius: 10px; padding: 10px 12px"><span style="font-size: 12px; color: #9AA4B5">Мінімум · {{det.minAt}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: #8EC9F5">{{det.min}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px; background: #0F1622; border-radius: 10px; padding: 10px 12px"><span style="font-size: 12px; color: #9AA4B5">Максимум · {{det.maxAt}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: #F7B57A">{{det.max}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px; background: #0F1622; border-radius: 10px; padding: 10px 12px; grid-column: 1 / -1"><span style="font-size: 12px; color: #9AA4B5">Вологість зараз</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: #8EC9F5">{{det.hum}}</span></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <svg viewBox="0 0 320 112" width="100%" role="img" aria-label="{{det.chartAria}}" style="display: block">
              <sc-for list="{{det.gridY}}" as="gy">
                <line x1="0" x2="320" y1="{{gy.y}}" y2="{{gy.y}}" stroke="rgba(255,255,255,0.08)"></line>
              </sc-for>
              <path d="{{det.area}}" fill="{{det.color}}" opacity="0.14"></path>
              <polyline points="{{det.line}}" fill="none" stroke="{{det.color}}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
              <circle cx="{{det.dot.x}}" cy="{{det.dot.y}}" r="4" fill="{{det.color}}" stroke="#121A27" stroke-width="2"></circle>
            </svg>
            <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8B95A7">
              <span>{{det.xStart}}</span><span>{{det.xMid}}</span><span>зараз</span>
            </div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8B95A7">шкала: {{det.yRange}}</div>
          </div>
          <p style="margin: 0; font-size: 13px; color: #C9D1DE">Зміна за добу: <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600">{{det.delta}}</span></p>
        </section>
      </sc-if>
      <sc-if value="{{noSel}}">
        <section style="display: flex; flex-direction: column; gap: 12px; background: #121A27; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px">
          <h2 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 18px; font-weight: 700; color: #F2F4F8">Уся кімната</h2>
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #C9D1DE">Оберіть датчик у кімнаті або в списку — камера наблизиться до нього, і довкола з’явиться кільце з графіком за 24 години. Кожен сегмент кільця — одна година доби, 00:00 угорі.</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <div style="display: flex; flex-direction: column; gap: 2px; background: #0F1622; border-radius: 10px; padding: 10px 12px"><span style="font-size: 12px; color: #9AA4B5">Найтепліше</span><span style="font-size: 14px; font-weight: 600">{{room.warm}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px; background: #0F1622; border-radius: 10px; padding: 10px 12px"><span style="font-size: 12px; color: #9AA4B5">Найпрохолодніше</span><span style="font-size: 14px; font-weight: 600">{{room.cool}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px; background: #0F1622; border-radius: 10px; padding: 10px 12px"><span style="font-size: 12px; color: #9AA4B5">Розкид зараз</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600">{{room.spread}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px; background: #0F1622; border-radius: 10px; padding: 10px 12px"><span style="font-size: 12px; color: #9AA4B5">Діапазон за добу</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600">{{room.range}}</span></div>
          </div>
        </section>
      </sc-if>
      <button class="keyBtn" type="button" onClick="{{changeKey}}">Змінити ключ ThingSpeak</button>
    </aside>
  </main>
</div>
</template>

<script>
// ============================================================
//  Налаштування
// ============================================================
var CHANNEL_ID = '3579358';
var READ_KEY   = '';          // можна вписати сюди; інакше сторінка попросить ключ і запам'ятає
var REFRESH_MS = 60000;       // як часто оновлювати дані

// ============================================================
//  Мінімальний рушій шаблону ({{...}}, sc-for, sc-if, onX)
// ============================================================
var SVGNS = 'http://www.w3.org/2000/svg';
var HOLE = /\{\{\s*([^}]*?)\s*\}\}/g;
function look(scope, path) {
  path = (path || '').trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  var parts = path.split('.'), v = scope;
  for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
  return v;
}
function interp(str, scope) { return str.replace(HOLE, function (m, p) { var v = look(scope, p); return v == null ? '' : String(v); }); }
function single(str) { var m = /^\s*\{\{\s*([^}]*?)\s*\}\}\s*$/.exec(str || ''); return m ? m[1] : null; }

function build(node, scope, out, ns) {
  if (node.nodeType === 3) {
    var txt = node.nodeValue;
    if (txt.indexOf('{{') >= 0) txt = interp(txt, scope);
    out.push({ text: txt });
    return;
  }
  if (node.nodeType !== 1) return;
  var tag = node.localName;
  if (tag === 'sc-for') {
    var list = look(scope, single(node.getAttribute('list'))) || [];
    var as = node.getAttribute('as');
    for (var i = 0; i < list.length; i++) { var sc = Object.create(scope); sc[as] = list[i]; kids(node, sc, out, ns); }
    return;
  }
  if (tag === 'sc-if') { if (look(scope, single(node.getAttribute('value')))) kids(node, scope, out, ns); return; }
  var cns = tag === 'svg' ? SVGNS : ns;
  var v = { tag: tag, ns: cns, attrs: {}, on: {}, children: [] };
  for (var a = 0; a < node.attributes.length; a++) {
    var n = node.attributes[a].name, val = node.attributes[a].value;
    if (n.indexOf('on') === 0 && n.length > 2) {
      var p = single(val);
      if (p) { var fn = look(scope, p); if (typeof fn === 'function') v.on[n.slice(2).toLowerCase()] = fn; }
      continue;
    }
    if (n === 'id') continue;
    v.attrs[n] = val.indexOf('{{') >= 0 ? interp(val, scope) : val;
  }
  kids(node, scope, v.children, cns);
  out.push(v);

  constructor(props) {
    super(props);
    this.state = { sel: null, dYaw: 0, dPitch: 0, dragging: false, hover: null, pinned: null, hourView: null, status: 'loading', zoom: 1 };
    this.ptrs = {};
    this.pinch = null;
    this.innerClick = false;
    this.now = Date.now();
    this.room = buildRoom();
    this.raw = SENSORS.map(function () { return []; });
    this.hum = SENSORS.map(function () { return NaN; });
    this.lastTs = null;
    this.data = buildReal(this.raw, this.now);
    this.drag = null;
    this.moved = false;
  }

  async load() {
    var key = getKey();
    if (!key) { this.setState({ status: 'nokey' }); showSetup(); return; }
    try {
      var url = 'https://api.thingspeak.com/channels/' + CHANNEL_ID + '/feeds.json?api_key=' + encodeURIComponent(key) + '&minutes=1500&results=8000';
      var r = await fetch(url, { cache: 'no-store' });
      var j = r.ok ? await r.json() : null;
      if (!j || !j.feeds) {
        this.setState({ status: 'badkey' });
        showSetup('Не вдалося прочитати канал — перевірте ключ.');
        return;
      }
      var raw = SENSORS.map(function () { return []; }), hum = SENSORS.map(function () { return NaN; }), lastTs = null;
      j.feeds.forEach(function (fd) {
        var ts = Date.parse(fd.created_at);
        if (!isFinite(ts)) return;
        SENSORS.forEach(function (s, i) {
          var t = parseFloat(fd[s.fT]), h = parseFloat(fd[s.fH]);
          if (isFinite(t)) raw[i].push({ ts: ts, t: t });
          if (isFinite(h)) hum[i] = h;
        });
        if (lastTs == null || ts > lastTs) lastTs = ts;
      });
      raw.forEach(function (a) { a.sort(function (x, y) { return x.ts - y.ts; }); });
      this.raw = raw; this.hum = hum; this.lastTs = lastTs;
      this.now = Date.now();
      this.data = buildReal(raw, this.now);
      this.setState({ status: 'ok' });
    } catch (e) {
      this.now = Date.now();
      this.setState({ status: 'error' });
    }
  }

  select(i) {
    this.innerClick = true;
    if (this.moved) { this.moved = false; return; }
    this.setState({ sel: this.state.sel === i ? null : i, dYaw: 0, dPitch: 0, hover: null, pinned: null, hourView: null });
  }

  renderVals() {
    var self = this, st = this.state, data = this.data;
    var sel = st.sel;
    var cam = sel == null ? OVERVIEW : { target: SENSORS[sel].pos, ry: SENSORS[sel].cam.ry, rx: SENSORS[sel].cam.rx, zoom: SENSORS[sel].cam.zoom };
    var ry = Math.max(-85, Math.min(85, cam.ry + st.dYaw));
    var rx = Math.max(-78, Math.min(-3, cam.rx + st.dPitch));
    var tc = toCss(cam.target);
    var camT = 'translateZ(' + cam.zoom + 'px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) translate3d(' + (-tc[0]) + 'px,' + (-tc[1]) + 'px,' + (-tc[2]) + 'px)';
    var tr = st.dragging ? 'none' : 'transform 1.2s cubic-bezier(.65,0,.25,1)';
    var dd = 1100 - cam.zoom, rxr = rx * Math.PI / 180, ryr = ry * Math.PI / 180;
    var eyeX = tc[0] - dd * Math.cos(rxr) * Math.sin(ryr) + RW / 2;
    var visL = eyeX > 0, visR = eyeX < RW;
    var faces = this.room.map(function (fc) {
      if (!fc.g) return fc;
      var op = fc.g === 'W' ? (sel === 3 ? 0.16 : 1) : fc.g === 'D' ? (sel === 1 || sel === 2 ? 0.16 : 1) : ((fc.g === 'L' ? visL : visR) ? 1 : 0);
      return { w: fc.w, h: fc.h, t: fc.t, bg: fc.bg, img: fc.img, bs: fc.bs, bp: fc.bp, op: op };
    });
    function bb(pos, push) {
      var c = toCss(pos);
      return 'translate3d(' + c[0] + 'px,' + c[1] + 'px,' + c[2] + 'px) rotateY(' + (-ry) + 'deg) rotateX(' + (-rx) + 'deg) translateZ(' + push + 'px)';
    }
    var cur = data.map(function (d) { return d[23].t; });

    var markers = SENSORS.map(function (s, i) {
      var isSel = sel === i;
      return {
        code: s.code, name: s.name, temp: fmt(cur[i]), color: tempColor(cur[i]), halo: tempColor(cur[i], 0.22),
        t: bb(s.pos, 14), tr: st.dragging ? 'none' : 'transform 1.2s cubic-bezier(.65,0,.25,1), opacity .4s',
        op: isSel ? 0 : (sel == null ? 1 : 0.55), pe: isSel ? 'none' : 'auto',
        aria: s.name + ', ' + fmt(cur[i]) + '. Показати графік',
        pick: function () { self.select(i); }
      };
    });

    var list = SENSORS.map(function (s, i) {
      var d = data[i], fin = finite(d.map(function (p) { return p.t; }));
      var mn = fin.length ? Math.min.apply(null, fin) : 0, mx = fin.length ? Math.max.apply(null, fin) : 1;
      var span = Math.max(0.5, mx - mn);
      var spark = fin.length ? d.map(function (p, k) { return (2 + k * 68 / 23).toFixed(1) + ',' + (23 - (p.t - mn) / span * 20).toFixed(1); }).join(' ') : '';
      var on = sel === i;
      return {
        code: s.code, name: s.name, where: s.where, temp: fmt(cur[i]), color: tempColor(cur[i]), spark: spark,
        hum: isFinite(self.hum[i]) ? Math.round(self.hum[i]) + '%' : '',
        bg: on ? 'rgba(124,196,228,0.08)' : 'rgba(255,255,255,0.02)', border: on ? 'rgba(124,196,228,0.55)' : 'rgba(255,255,255,0.08)',
        pressed: on ? 'true' : 'false',
        pick: function () { self.moved = false; self.select(i); self.innerClick = false; }
      };
    });

    var curF = cur.map(function (t, i) { return { t: t, i: i }; }).filter(function (x) { return isFinite(x.t); });
    var avg = curF.length ? curF.reduce(function (a, b) { return a + b.t; }, 0) / curF.length : NaN;
    var all = finite([].concat.apply([], data.map(function (d) { return d.map(function (p) { return p.t; }); })));
    var room = { warm: '—', cool: '—', spread: '—', range: '—' };
    if (curF.length) {
      var hi0 = curF.reduce(function (a, b) { return b.t > a.t ? b : a; }), lo0 = curF.reduce(function (a, b) { return b.t < a.t ? b : a; });
      room.warm = SENSORS[hi0.i].name + ' · ' + fmt(hi0.t);
      room.cool = SENSORS[lo0.i].name + ' · ' + fmt(lo0.t);
      room.spread = (hi0.t - lo0.t).toFixed(1).replace('.', ',') + '°';
    }
    if (all.length) room.range = fmt(Math.min.apply(null, all)) + ' – ' + fmt(Math.max.apply(null, all));

    var badge, badgeColor;
    if (st.status === 'loading') { badge = 'Завантаження…'; badgeColor = '#9AA4B5'; }
    else if (st.status === 'ok' && self.lastTs && Date.now() - self.lastTs < 15 * 60000) { badge = 'Наживо · ThingSpeak'; badgeColor = '#5BC28A'; }
    else if (st.status === 'ok' && self.lastTs) { badge = 'Нових даних немає з ' + hm(self.lastTs); badgeColor = '#E9B44C'; }
    else if (st.status === 'ok') { badge = 'У каналі ще немає даних'; badgeColor = '#E9B44C'; }
    else if (st.status === 'error') { badge = 'Немає зв’язку з ThingSpeak'; badgeColor = '#E8553F'; }
    else { badge = 'Потрібен ключ ThingSpeak'; badgeColor = '#E8553F'; }

    var vals = {
      faces: faces, markers: markers, list: list, room: room,
      camT: camT, camTr: tr, sceneScale: ((window.innerWidth <= 700 ? 0.62 : 1) * st.zoom).toFixed(3), cursor: st.dragging ? 'grabbing' : 'grab',
      hasSel: sel != null, noSel: sel == null, ringOn: sel != null,
      updated: self.lastTs ? hm(self.lastTs) : '—',
      badge: badge, badgeColor: badgeColor,
      changeKey: function () { showSetup(); },
      roomAvg: fmt(avg), roomAvgColor: tempColor(avg),
      stageClick: function () {
        if (self.innerClick) { self.innerClick = false; return; }
        if (self.moved) { self.moved = false; return; }
        if (self.state.hourView != null) { self.setState({ hourView: null, pinned: self.state.dayPinned != null ? self.state.dayPinned : null, hover: null }); return; }
        if (self.state.sel != null) self.setState({ sel: null, dYaw: 0, dPitch: 0, hover: null, pinned: null, hourView: null });
      },
      openHour: function () {
        self.innerClick = true;
        var st0 = self.state, d0 = self.data[st0.sel], k = 23;
        if (st0.pinned != null) for (var q = 0; q < 24; q++) if (d0[q].hd === st0.pinned) k = q;
        self.setState({ hourView: k, dayPinned: st0.pinned, pinned: null, hover: null });
      },
      closeHour: function () { self.innerClick = true; self.setState({ hourView: null, pinned: self.state.dayPinned != null ? self.state.dayPinned : null, hover: null }); },
      hint: sel == null ? 'Перетягніть — обертати · колесо або два пальці — масштаб · натисніть на датчик' : 'Натисніть на поділку, щоб закріпити · поза кільцем — назад до кімнати',
      hourMode: false, dayMode: true, rl: { a: '', b: '', c: '', d: '' }, ringClick: function () { self.innerClick = true; },
      clearHover: function () { self.setState({ hover: null }); },
      onDown: function (e) {
        self.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
        var ids = Object.keys(self.ptrs);
        if (ids.length >= 2) {
          var a = self.ptrs[ids[0]], b = self.ptrs[ids[1]];
          self.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: self.state.zoom };
          self.drag = null; self.moved = true;
          return;
        }
        self.drag = { x: e.clientX, y: e.clientY, dy: self.state.dYaw, dp: self.state.dPitch }; self.moved = false;
      },
      onWheel: function (e) {
        e.preventDefault();
        var z = Math.max(1, Math.min(2, self.state.zoom * Math.exp(-e.deltaY * 0.0015)));
        if (z !== self.state.zoom) self.setState({ zoom: z });
      },
      onMove: function (e) {
        if (self.ptrs[e.pointerId]) self.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
        if (self.pinch) {
          var ids = Object.keys(self.ptrs);
          if (ids.length >= 2) {
            var a = self.ptrs[ids[0]], b = self.ptrs[ids[1]];
            var z = Math.max(1, Math.min(2, self.pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / self.pinch.d));
            self.setState({ zoom: z });
          }
          return;
        }
        var d = self.drag; if (!d) return;
        var dx = e.clientX - d.x, dy = e.clientY - d.y;
        if (!self.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
        self.moved = true;
        self.setState({ dragging: true, dYaw: d.dy + dx * 0.25, dPitch: d.dp - dy * 0.2 });
      },
      onUp: function (e) {
        if (e && e.pointerId != null) delete self.ptrs[e.pointerId];
        if (Object.keys(self.ptrs).length < 2) self.pinch = null;
        self.drag = null; if (self.state.dragging) self.setState({ dragging: false });
      },
      ringT: '', ringMove: function () {}, ringAria: '', bars: [], grid: [], nowDot: { x: 0, y: 0, op: 0 }, center: { code: '', temp: '', sub: '', color: '#fff' },
      det: { code: '', name: '', now: '', avg: '', min: '', max: '', minAt: '', maxAt: '', hum: '', color: '#fff', line: '', area: '', dot: { x: 0, y: 0 }, gridY: [], xStart: '', xMid: '', delta: '', chartAria: '' }
    };

    if (sel != null) {
      var s = SENSORS[sel], d = data[sel];
      var ts = d.map(function (p) { return p.t; });
      var tf = finite(ts);
      var mn = tf.length ? Math.min.apply(null, tf) : NaN, mx = tf.length ? Math.max.apply(null, tf) : NaN;
      var mean = tf.length ? tf.reduce(function (a, b) { return a + b; }, 0) / tf.length : NaN;
      vals.ringT = bb(s.pos, 90) + ' scale(' + (window.innerWidth <= 700 ? 1.6 : 1.4) + ')';
      var hourMode = st.hourView != null, segs, N, now = new Date(self.now), havg = NaN;
      if (!hourMode) {
        N = 24;
        segs = [];
        for (var hs = 0; hs < 24; hs++) segs.push({ future: true, t: null, label: hh(hs) + '–' + hh((hs + 1) % 24) });
        d.forEach(function (p, k) {
          if (p.hd <= d[23].hd && !p.filled && isFinite(p.t))
            segs[p.hd] = { future: false, t: p.t, label: hh(p.hd) + '–' + hh((p.hd + 1) % 24), isNow: k === 23 };
        });
      } else {
        // реальні 5-хвилинні показники за обрану годину
        N = 12;
        var hk = st.hourView, hpnt = d[hk], hs0 = hpnt.start, rawS = self.raw[sel];
        var avail = hk === 23 ? Math.floor(now.getMinutes() / 5) + 1 : 12;
        var sums = [], cnts = [];
        for (var z = 0; z < 12; z++) { sums.push(0); cnts.push(0); }
        rawS.forEach(function (p) {
          if (p.ts >= hs0 && p.ts < hs0 + 3600000) { var mi = Math.floor((p.ts - hs0) / 300000); sums[mi] += p.t; cnts[mi]++; }
        });
        var lastReal = -1;
        for (var z2 = 0; z2 < 12; z2++) if (z2 < avail && cnts[z2]) lastReal = z2;
        segs = [];
        for (var m = 0; m < 12; m++) {
          var mm0 = m * 5, mm1 = m * 5 + 5;
          var lab = String(hpnt.hd).padStart(2, '0') + ':' + String(mm0).padStart(2, '0') + '–' + (mm1 === 60 ? hh((hpnt.hd + 1) % 24) : String(hpnt.hd).padStart(2, '0') + ':' + String(mm1).padStart(2, '0'));
          if (m < avail && cnts[m]) segs.push({ future: false, t: Math.round(sums[m] / cnts[m] * 10) / 10, label: lab, isNow: hk === 23 && m === lastReal });
          else segs.push({ future: true, t: null, label: lab });
        }
        var real = segs.filter(function (x) { return !x.future; }).map(function (x) { return x.t; });
        havg = real.length ? real.reduce(function (a, b) { return a + b; }, 0) / real.length : hpnt.t;
      }
      var segStep = 360 / N, gap = hourMode ? 2.2 : 1.6;
      function kAt(e) {
        var el = e.currentTarget; if (!el || !el.getBoundingClientRect) return undefined;
        var rc = el.getBoundingClientRect(), sc = rc.width / 332;
        var dx = e.clientX - (rc.left + rc.width / 2), dy = e.clientY - (rc.top + rc.height / 2);
        var r = Math.sqrt(dx * dx + dy * dy) / (sc || 1);
        var k = null;
        if (r > 68 && r < 160) {
          var ang = Math.atan2(dy, dx) * 180 / Math.PI + 90;
          var idx = ((Math.floor(ang / segStep) % N) + N) % N;
          if (!segs[idx].future) k = idx;
        }
        return { k: k, r: r };
      }
      vals.ringMove = function (e) {
        var h = kAt(e); if (!h) return;
        if (self.state.hover !== h.k) self.setState({ hover: h.k });
      };
      vals.ringClick = function (e) {
        self.innerClick = true;
        var h = kAt(e); if (!h || h.k == null) return;
        self.setState({ pinned: self.state.pinned === h.k ? null : h.k });
      };
      vals.ringAria = hourMode ? 'Температура ' + s.name + ' за годину ' + segs[0].label.slice(0, 5) + ', кожні 5 хвилин' : 'Кільцевий графік температури ' + s.name + ' за сьогодні';
      var eff = st.hover != null ? st.hover : st.pinned;
      vals.bars = segs.map(function (g, k) {
        var a0 = k * segStep - 90 + gap, a1 = (k + 1) * segStep - 90 - gap;
        if (g.future) return { d: wedge(72, 104, a0, a1), fill: '#2A3240', op: 1, stroke: 'none', hover: function () {} };
        var isHover = eff === k;
        return {
          d: wedge(72, rad(g.t), a0, a1), fill: tempColor(g.t),
          op: eff == null ? 1 : (isHover ? 1 : 0.4),
          stroke: g.isNow || isHover ? '#F2F4F8' : 'none',
          hover: function () { if (self.state.hover !== k) self.setState({ hover: k }); }
        };
      });
      vals.grid = [10, 20, 30, 40, 50].map(function (t) { return { r: rad(t) }; });
      var rlab = hourMode ? [':00', ':15', ':30', ':45'] : ['00', '06', '12', '18'];
      vals.rl = { a: rlab[0], b: rlab[1], c: rlab[2], d: rlab[3] };
      var nowIdx = -1; segs.forEach(function (g, k) { if (g.isNow) nowIdx = k; });
      var nd = nowIdx >= 0 ? pol(rad(segs[nowIdx].t) + 6, nowIdx * segStep - 90 + segStep / 2) : [0, 0];
      vals.nowDot = { x: nd[0], y: nd[1], op: nowIdx >= 0 ? 1 : 0 };
      var shown = eff != null ? segs[eff] : null;
      var ct = shown ? shown.t : (hourMode ? havg : d[23].t);
      vals.center = {
        code: s.name.toUpperCase(), temp: fmt(ct), color: tempColor(ct),
        sub: shown ? shown.label : (hourMode ? hh(d[st.hourView].hd) + '–' + hh((d[st.hourView].hd + 1) % 24) + ' · сер.' : 'зараз')
      };
      vals.hourMode = hourMode; vals.dayMode = !hourMode;
      var lo = isFinite(mn) ? Math.floor(mn - 0.3) : 0, hi = isFinite(mx) ? Math.ceil(mx + 0.3) : 1;
      function X(k) { return 6 + k * (308 / 23); }
      function Y(t) { return 8 + (hi - t) / (hi - lo) * 96; }
      var line = tf.length ? d.map(function (p, k) { return X(k).toFixed(1) + ',' + Y(p.t).toFixed(1); }).join(' ') : '';
      var minK = Math.max(0, ts.indexOf(mn)), maxK = Math.max(0, ts.indexOf(mx));
      var gy = [];
      var step = hi - lo > 3 ? 2 : 1;
      for (var g = lo; g <= hi; g += step) gy.push({ y: Y(g).toFixed(1), t: g + '°' });
      var delta = d[23].t - d[0].t;
      vals.det = {
        code: s.code, name: s.name, now: fmt(d[23].t), avg: fmt(mean), min: fmt(mn), max: fmt(mx),
        minAt: hh(d[minK].hd), maxAt: hh(d[maxK].hd), color: tempColor(d[23].t),
        hum: isFinite(self.hum[sel]) ? self.hum[sel].toFixed(1).replace('.', ',') + '%' : '—',
        line: line, area: line ? 'M' + X(0).toFixed(1) + ',' + Y(lo).toFixed(1) + ' L' + line.split(' ').join(' L') + ' L' + X(23).toFixed(1) + ',' + Y(lo).toFixed(1) + ' Z' : '',
        dot: { x: X(23).toFixed(1), y: isFinite(d[23].t) ? Y(d[23].t).toFixed(1) : -100 }, gridY: gy,
        xStart: hh(d[0].hd), xMid: hh(d[12].hd),
        yRange: lo + '…' + hi + '°',
        delta: isFinite(delta) ? (delta >= 0 ? '+' : '−') + Math.abs(delta).toFixed(1).replace('.', ',') + '°' : '—',
        chartAria: 'Лінійний графік ' + s.name + ' за 24 години, від ' + fmt(mn) + ' до ' + fmt(mx)
      };
    }
    return vals;
  }
}

// ============================================================
//  Старт
// ============================================================
tplRoot = document.getElementById('tpl').content;
appEl = document.getElementById('app');
comp = new Component({});
renderNow();
comp.load();
setInterval(function () { comp.load(); }, REFRESH_MS);
window.addEventListener('resize', scheduleRender);

document.getElementById('setupForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = document.getElementById('keyInput').value.trim();
  if (!v) { document.getElementById('setupErr').textContent = 'Вставте ключ.'; return; }
  try { localStorage.setItem('ts_read_key', v); } catch (err) { READ_KEY = v; }
  if (!READ_KEY) READ_KEY = '';
  document.getElementById('setup').hidden = true;
  comp.setState({ status: 'loading' });
  comp.load();
});
</script>
</body>
</html>
